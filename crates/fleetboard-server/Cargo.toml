[package]
name = "fleetboard-server"
description = "Polls every Fleetboard client, keeps 24 h of history and serves the dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fleetboard-server"
path = "src/main.rs"

[dependencies]
fleetboard-proto = { path = "../fleetboard-proto" }   # the wire types
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }   # HTTP server with built-in SSE
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }   # polls the clients; rustls so musl needs no OpenSSL
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"                                           # server.toml
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }   # SQLite compiled in: one static binary
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
rand = "0.8"                                           # gen-token
rust-embed = { version = "8", features = ["interpolate-folder-path"] }   # the dashboard's HTML, CSS and JS inside the binary ($CARGO_MANIFEST_DIR in the folder path)
async-stream = "0.3"                                   # the SSE generator
futures = "0.3"                                        # join_all over the hosts each tick
mime_guess = "2"                                       # content types for the embedded assets

[dev-dependencies]
fleetboard-client = { path = "../fleetboard-client" }  # the integration test polls a real client router
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
